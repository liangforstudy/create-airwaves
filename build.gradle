plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = 'create-airwaves-reconstructed'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
    // Public Modrinth Maven repository. These replace the previously
    // user-supplied JARs in libs/ and make a fresh clone compile directly.
    maven { url = 'https://api.modrinth.com/maven' }
}

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Create publishes its development API as separate Maven artifacts; the
    // copied runtime JAR alone is not sufficient for compilation.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Compatibility APIs. These are fetched automatically for a clean clone;
    // none are shaded or redistributed in the produced Airwaves JAR.
    implementation('maven.modrinth:sable:2.0.6+mc1.21.1')
    // Pinned to the Modrinth version id: the 0.6.2 version number also names
    // the 1.20.1 Forge build, which Modrinth's Maven resolves instead.
    implementation('maven.modrinth:power-grid:jCkPHjmP')
    // Power Grid 0.6.2's own mandatory dependency.
    implementation('maven.modrinth:architectury-api:13.0.11+neoforge')
    implementation('maven.modrinth:create-electro-energetics:1.21.1-1.1.1')
    implementation('maven.modrinth:simple-voice-chat:neoforge-1.21.1-2.6.21')
    implementation('mezz.jei:jei-1.21.1-neoforge:19.53.0.425')

    // Test-only: s00d/minecraft-mcp 0.6.0 (GitHub release), an MCP endpoint in the client
    // that can click screen buttons and list played sounds. Downloaded into libs/, which is
    // gitignored; not part of the built jar. (Replaced Numen on 2026-11-09.)
    runtimeOnly files('libs/minecraft_mcp-neoforge-0.6.0+1.21.1.jar')

    // Test-only performance mods for the dev client (Modrinth version IDs, NeoForge 1.21.1).
    runtimeOnly('maven.modrinth:ferrite-core:x7kQWVju')     // 7.0.3
    runtimeOnly('maven.modrinth:modernfix:ZDZENbHH')        // 5.27.27
    runtimeOnly('maven.modrinth:spark:v5qtqRQi')            // 1.10.124
    runtimeOnly('maven.modrinth:immediatelyfast:EJzmEPZV')  // 1.6.15
    runtimeOnly('maven.modrinth:entityculling:eieYbWYb')    // 1.11.3

    // Not referenced directly by Java source, but needed for a development
    // game run matching the reconstructed mod's declared environment.
    runtimeOnly('maven.modrinth:create-aeronautics:1.3.2+mc1.21.1')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'Create: Airwaves',
            'Specification-Version' : project.version,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
        ])
    }
}
